<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NidanSarthi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:rgba(130, 120, 100, 0.1);
        }

        .login-box {
            width: 360px;
            border-style: solid;
            border-color: black;
            border-width: 2px;
            background:rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 10px;
            color: #0c0c0c;
        }

        .login-box p {
            color: #171817;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 7px;
            font-weight: bold;
            color: #0e0c0c;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d9cccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1769aa;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f82;
        }

        #otpSection {
            display: none;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #f50707;
        }
        body {
            background-color: rgba(130, 120, 100, 0.1);
            background-image: url('logo.jpeg');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body>
    
    <div class="login-box">

        <h2>Login</h2>
        <p>Enter your Aadhaar number to continue</p>

        <div id="aadhaarSection">

            <label>Aadhaar Number</label>

            <input
                type="text"
                id="aadhaar"
                maxlength="12"
                placeholder="Enter 12-digit number"
            >

            <button onclick="sendOTP()">Send OTP</button>

        </div>

        <div id="otpSection">

            <label>Enter OTP</label>

            <input
                type="text"
                id="otp"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
            >

            <button onclick="verifyOTP()">Verify OTP</button>

        </div>

        <div id="message"></div>

        <div class="note">
            NidanSarthi Health System || Powered by ABHA
        </div>

    </div>

    <script>

        let generatedOTP;

        function sendOTP() {

            let aadhaar = document.getElementById("aadhaar").value;
            let message = document.getElementById("message");

            if (!/^[0-9]{12}$/.test(aadhaar)) {
                message.style.color = "red";
                message.innerHTML =
                    "Please enter a valid 12-digit number.";
                return;
            }

            // Generate demo OTP
            generatedOTP =
                Math.floor(100000 + Math.random() * 900000);

            console.log("Demo OTP:", generatedOTP);

            document.getElementById("aadhaarSection").style.display = "none";
            document.getElementById("otpSection").style.display = "block";

            message.style.color = "green";
            message.innerHTML =
                " OTP sent to your Aadhaar linked mobile number.";
        }


        function verifyOTP() {

            let otp = document.getElementById("otp").value;
            let message = document.getElementById("message");

            if (otp === generatedOTP.toString()) {

                message.style.color = "green";
                message.innerHTML =
                    "Login successful!";

            } else {

                message.style.color = "red";
                message.innerHTML =
                    "Invalid OTP. Please try again.";
            }
        }

    </script>

</body>
</html>
